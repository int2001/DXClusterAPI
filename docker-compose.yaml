version: '3.8'

services:
  dxcluster:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: dxcluster
    env_file:
      - .env    # Load all configuration from .env file
    ports:
      - "${WEBPORT:-3000}:${WEBPORT:-3000}"    # Port mapping from .env
    volumes:
      - ./logs:/usr/src/app/logs    # Persist logs outside container
      - ./data:/usr/src/app/data    # Persist analytics and data outside container
    restart: unless-stopped
    environment:
      MODE: docker    # Override to ensure Docker mode
