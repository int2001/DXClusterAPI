<!DOCTYPE html>
<html lang="en">
<head>

    <title>Redirecting...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

            text-align: center;

        }

        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Redirecting to Wavelog</h1>

</html>
