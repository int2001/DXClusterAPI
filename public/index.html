<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX Cluster Spot Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .stats {
            background: #f8f9fa;
            padding: 15px 30px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .table-container {
            overflow-x: auto;
            max-height: calc(100vh - 240px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 10;
        }

        th {
            text-align: left;
            padding: 15px 20px;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        tbody tr.new-spot {
            animation: highlight 2s;
        }

        @keyframes highlight {
            0% {
                background-color: #ffffcc;
            }
            100% {
                background-color: white;
            }
        }

        .callsign {
            font-weight: 600;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .frequency {
            font-family: 'Courier New', monospace;
            color: #764ba2;
            font-weight: 600;
        }

        .flag {
            font-size: 20px;
        }

        .entity {
            color: #333;
        }

        .time {
            color: #666;
            font-size: 12px;
        }

        .message {
            color: #555;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 16px;
        }

        .band-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DX Cluster Spot Stream</h1>
            <div class="status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total Spots</span>
                <span class="stat-value" id="totalSpots">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Spots/Min</span>
                <span class="stat-value" id="spotsPerMin">0</span>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Spotted</th>
                        <th>Entity</th>
                        <th>Frequency</th>
                        <th>Band</th>
                        <th>Message</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="spotsTable">
                    <tr>
                        <td colspan="6" class="no-data">Waiting for spots...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let ws;
        let totalSpots = 0;
        let spotsInLastMinute = [];
        const maxDisplaySpots = 100;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'spot') {
                        addSpot(message.data);
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus(false);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus(false);
                // Attempt to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');

            if (connected) {
                indicator.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                indicator.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        function addSpot(spot) {
            const table = document.getElementById('spotsTable');

            // Remove "no data" message if present
            if (table.querySelector('.no-data')) {
                table.innerHTML = '';
            }

            // Create new row
            const row = document.createElement('tr');
            row.className = 'new-spot';

            // Format time
            const time = new Date(spot.when);
            const timeStr = time.toLocaleTimeString();

            // Build row HTML
            row.innerHTML = `
                <td><span class="callsign">${escapeHtml(spot.spotted)}</span></td>
                <td>
                    <span class="flag">${spot.dxcc_spotted?.flag || ''}</span>
                    <span class="entity">${escapeHtml(spot.dxcc_spotted?.entity || 'Unknown')}</span>
                </td>
                <td><span class="frequency">${spot.frequency.toFixed(1)} kHz</span></td>
                <td><span class="band-badge">${escapeHtml(spot.band || 'N/A')}</span></td>
                <td><span class="message">${escapeHtml(spot.message || '')}</span></td>
                <td><span class="time">${timeStr}</span></td>
            `;

            // Insert at the beginning
            table.insertBefore(row, table.firstChild);

            // Limit number of displayed spots
            while (table.children.length > maxDisplaySpots) {
                table.removeChild(table.lastChild);
            }

            // Update statistics
            totalSpots++;
            document.getElementById('totalSpots').textContent = totalSpots;

            // Track spots for rate calculation
            spotsInLastMinute.push(Date.now());
            // Remove spots older than 1 minute
            const oneMinuteAgo = Date.now() - 60000;
            spotsInLastMinute = spotsInLastMinute.filter(time => time > oneMinuteAgo);
            document.getElementById('spotsPerMin').textContent = spotsInLastMinute.length;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize WebSocket connection
        connectWebSocket();

        // Update spots per minute every 5 seconds
        setInterval(() => {
            const oneMinuteAgo = Date.now() - 60000;
            spotsInLastMinute = spotsInLastMinute.filter(time => time > oneMinuteAgo);
            document.getElementById('spotsPerMin').textContent = spotsInLastMinute.length;
        }, 5000);
    </script>
</body>
</html>
